{{ define "main" }}
  {{ $posts := sort .RegularPages "Params.archive_order" "asc" }}
  <main class="blog-archive" aria-labelledby="blog-title">
    <h1 id="blog-title" class="visually-hidden">{{ .Title }}</h1>
    <div class="blog-grid">
      {{ range $index, $post := $posts }}
        <article class="blog-card{{ if eq $index 0 }} blog-card--featured{{ end }}">
          <a class="blog-card__link" href="{{ $post.RelPermalink }}" target="_blank" rel="noopener noreferrer">
            {{ with $post.Params.image }}
              <img class="blog-card__image" src="{{ . | relURL }}" alt="{{ $post.Params.image_alt | default $post.Title }}" {{ if eq $index 0 }}fetchpriority="high"{{ else }}loading="lazy"{{ end }}>
            {{ else }}
              <span class="blog-card__image blog-card__image--placeholder" aria-hidden="true"></span>
            {{ end }}
            <h2 class="blog-card__title">{{ $post.Title }}</h2>
          </a>
        </article>
      {{ end }}
    </div>
  </main>
{{ end }}
