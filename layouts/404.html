<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Home.Params.not_found_title }} | {{ .Site.Home.Title }}</title>
    <meta name="description" content="{{ .Site.Home.Params.not_found_description }}">
    <link rel="canonical" href="https://dondeaprendoaws.com/404.html">
    {{ $assets := partial "site-assets.html" . }}
    {{ $icon := $assets.icon }}
    <link rel="icon" type="image/png" href="{{ $icon.RelPermalink }}" sizes="120x120">
    {{ $style := $assets.style }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" crossorigin="anonymous">
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="/" aria-label="Inicio: {{ .Site.Home.Title }}">{{ .Site.Home.Title }}</a>
    </header>
    <main class="not-found">
      <p class="not-found__code">404</p>
      <h1>{{ .Site.Home.Params.not_found_title }}</h1>
      <p>{{ .Site.Home.Params.not_found_description }}</p>
      <a href="/" class="show-all">{{ .Site.Home.Params.not_found_link }}</a>
    </main>
  </body>
</html>
